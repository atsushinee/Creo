[project]
name = "creo-backend"
version = "0.1.0"
description = "Creo — AI Agent Workspace backend (FastAPI + DeepAgents + SSE)"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.2",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langchain>=0.3",
    "langchain-openai>=1.0",
    "langgraph>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymilvus>=3.0.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "unstructured-transform-client>=0.18.21",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RET", # return
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
